# What counts as a relevant job. Phrases match whole words in the job title, ignoring case.
# Roles are checked in this order and the first match wins, so specific roles come first.
roles:
  ml_eng:
    - machine learning
    - ml
    - mlops
    - ml ops
    - ml platform
    - deep learning
    - computer vision
    - nlp engineer
  ai:
    - ai engineer
    - applied ai
    - generative ai
    - genai
    - llm
    - ai developer
    - ai/ml
    - research engineer
    - applied scientist
  data_eng:
    - data engineer
    - data engineering
    - analytics engineer
    - data platform
    - etl developer
    - big data
  backend:
    - backend
    - back end
    - back-end
    - python developer
    - python engineer
    - golang developer
    - golang engineer
    - go engineer
    - java developer
    - java engineer
    - api engineer
    - platform engineer
    - infrastructure engineer
    - distributed systems
  software:
    - software engineer
    - software engineering
    - software developer
    - software development engineer
    - sde
    - full stack
    - fullstack
    - full-stack
    - founding engineer
    - product engineer
    - forward deployed engineer
    - member of technical staff
  business_analyst:
    - business analyst
    - business systems analyst
    - product analyst
    - data analyst

# Any of these in a title rejects the job.
exclude_titles:
  - director
  - vice president
  - vp
  - head of
  - chief
  - manager
  - sales
  - recruiter
  - account executive
  - marketing
  - designer
  - clearance
  # Seniority: currently a May 2026 graduate with about 1 year of experience.
  - senior
  - sr
  - staff
  - principal
  - lead
  - architect
  - intern
  - internship

# Exclusion words inside these phrases don't count ("staff" here isn't a level).
always_allow:
  - member of technical staff

# Reject postings whose lowest stated requirement is above this many years.
max_required_years: 4
max_age_days: 30
daily_score_limit: 30
